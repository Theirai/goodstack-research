'use strict';
const gateEl=id=>document.getElementById(id);
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));

gateEl('unlockform').addEventListener('submit',async event=>{
 event.preventDefault();const button=gateEl('unlockbutton');button.disabled=true;button.textContent='正在解密報告…';gateEl('error').textContent='';
 try{
  if(!window.crypto?.subtle||!window.DecompressionStream)throw Error('unsupported');
  const packet=JSON.parse(gateEl('encrypted-report').textContent);
  const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(gateEl('password').value),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:decode(packet.salt),iterations:packet.iterations,hash:'SHA-256'},material,{name:'AES-GCM',length:256},false,['decrypt']);
  const compressed=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(packet.iv)},key,decode(packet.data));
  const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream('gzip'));
  const protectedContent=JSON.parse(await new Response(stream).text());
